name: Apply native controller and save fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_native_controller_fix.py'
      - 'modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/PS1PlayerActivity.kt'
      - 'modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/PlayStationStyleDpad.kt'
      - '.github/workflows/apply-native-controller-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[native-controller-autofix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python tools/apply_native_controller_fix.py
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/PS1PlayerActivity.kt modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/PlayStationStyleDpad.kt
          git commit -m "fix(controller): integrate connected D-pad and persistent save access [native-controller-autofix]"
          git push
